name: Build and Deploy Next to VPS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Create environment file
        run: |
          echo "NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}" >> .env.production
          echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" >> .env.production
          echo "NEXT_STORAGE_HOST=${{ secrets.NEXT_STORAGE_HOST }}" >> .env.production
          echo "NEXT_STORAGE_PORT=${{ secrets.NEXT_STORAGE_PORT }}" >> .env.production

      - name: Build application
        run: yarn build
        env:
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_STORAGE_HOST: ${{ secrets.NEXT_STORAGE_HOST }}
          NEXT_STORAGE_PORT: ${{ secrets.NEXT_STORAGE_PORT }}

      # Small tarball: dependencies are installed on the VPS (see extract step). Extract overlays existing files; yarn then reconciles node_modules.
      - name: Create deployment package
        run: |
          mkdir -p deployment
          cp -r .next deployment/
          cp -r public deployment/
          cp package.json deployment/
          cp yarn.lock deployment/
          cp next.config.ts deployment/
          cp ecosystem.config.js deployment/
          cp .env.production deployment/
          tar -czf deployment.tar.gz -C deployment .

      - name: Deploy to Cloud VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          script: |
            # Create application directory if it doesn't exist
            sudo mkdir -p /var/www/spa-admin
            sudo chown $USER:$USER /var/www/spa-admin

            # Stop the application if it's running with PM2
            pm2 stop spa-admin || true

      - name: Copy deployment package to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          source: 'deployment.tar.gz'
          target: '/var/www/spa-admin/'

      - name: Extract and setup application on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          command_timeout: 30m
          script: |
            cd /var/www/spa-admin

            # Overlay new release onto the folder (no full rm). Tar replaces paths present in the archive; yarn updates node_modules to match yarn.lock.
            tar -xzf deployment.tar.gz
            rm -f deployment.tar.gz

            # Install production deps on server (--network-timeout avoids flaky networks failing fast)
            yarn install --frozen-lockfile --production --network-timeout 600000

            # Set proper permissions
            sudo chown -R $USER:$USER /var/www/spa-admin
            sudo chmod -R 755 /var/www/spa-admin

            # Start the application with PM2
            pm2 start ecosystem.config.js
            pm2 save

            # Check application status
            sleep 5
            pm2 status
